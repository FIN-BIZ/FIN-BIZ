name: Daily website maintenance

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-website-maintenance
  cancel-in-progress: false

jobs:
  propose-improvement:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.export-patch.outputs.has_changes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Make one focused website improvement
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            Read .github/agents/finbiz-website.agent.md and follow its guidance.

            This is the daily maintenance run for the Vietnamese FIN BIZ financial
            consulting website. Inspect the existing HTML pages, then make at most
            one small, meaningful improvement to the existing website. Prioritize
            factual accuracy, accessibility, mobile usability, broken links, and
            clear navigation. Keep the FIN BIZ brand and existing static HTML/CSS
            approach.

            Do not copy competitor content or invent financial figures, rates,
            terms, testimonials, legal claims, or business results. Do not change
            deployment settings, contact details, policies, or production data.
            Do not add dependencies. If no substantiated improvement is needed,
            leave the repository unchanged.

            Inspect your diff and run git diff --check before finishing. Do not
            deploy or publish the website.

      - name: Validate and export HTML changes
        id: export-patch
        run: |
          git diff --check
          git diff --binary -- '*.html' > "$RUNNER_TEMP/site.patch"
          if [[ -s "$RUNNER_TEMP/site.patch" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload HTML patch
        if: steps.export-patch.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/site.patch
          retention-days: 1

  open-pull-request:
    needs: propose-improvement
    if: needs.propose-improvement.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download HTML patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/site-patch

      - name: Apply proposed changes
        run: |
          git apply --check "$RUNNER_TEMP/site-patch/site.patch"
          git apply "$RUNNER_TEMP/site-patch/site.patch"

      - name: Open a pull request when changes exist
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/daily-website-${{ github.run_id }}
          delete-branch: true
          commit-message: "Improve FIN BIZ website"
          title: "Daily website improvement"
          body: |
            Automated, focused website maintenance proposal.

            Please review the content and rendered pages before merging. This
            workflow never deploys changes directly.